name: Bug report / 数据缺口或界面问题
description: Report an issue with sanitized reproduction details.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: '请勿上传密钥、Cookie、原始聊天记录、完整数据库、台账或私人截图。仅提供字段结构和虚构样例。Do not post credentials or private logs.'
  - type: input
    id: versions
    attributes:
      label: Versions / 版本
      description: DSH, plugin, affected agent/tool and OS versions
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction / 复现步骤
      description: What did you do? Which source or tab was affected?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual / 预期与实际
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics / 脱敏诊断
      description: Source status, last success time, error text, minimal synthetic schema example. Do not attach a real ledger.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check / 隐私检查
      options:
        - label: I removed private content, credentials and machine/project paths from this report.
          required: true
