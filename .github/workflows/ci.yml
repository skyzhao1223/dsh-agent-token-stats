name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: Syntax checks
        run: |
          node --check lib/index.js
          node --check lib/client.js
      - name: Isolated regression suites (no operator HOME)
        run: npm test
      - name: Package distribution check
        run: npm pack --dry-run
