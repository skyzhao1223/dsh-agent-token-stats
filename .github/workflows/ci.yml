name: CI
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check lib/index.js
          node --check lib/client.js
      - name: Smoke test
        run: node scripts/smoke.mjs
      - name: Instant cold open (ledger snapshot)
        run: node scripts/verify-cold-snapshot.mjs
      - name: Pricing, currency and reasoning tiers
        run: node scripts/verify-pricing.mjs
      - name: Client UX (skeleton, filters, drill-down, a11y)
        run: node scripts/verify-ux.mjs
